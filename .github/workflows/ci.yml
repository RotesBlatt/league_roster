name: ci

# Every action is pinned to a commit SHA. Versions: actions/checkout v5.1.0,
# oven-sh/setup-bun v2.2.0, actions/cache v5.1.0, docker/setup-buildx-action
# v4.4.1, docker/build-push-action v7.4.0 — all of them declare `node24`,
# the runner no longer needs to force-upgrade them.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5

jobs:
  # lint, types, unit tests, SPA build — no infrastructure needed
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Markdown is out of Biome's scope on purpose (biome.json):
      # docs are hand-written prose, and the formatter rewrites tables, list
      # markers and emphasis — which fails this gate for no gain.
      - name: lint + format (read only)
        run: bunx biome check .

      - name: types
        run: bun run typecheck

      - name: unit tests
        run: bun run test

      - name: build SPA
        run: bun run build

  # real Postgres, throwaway databases per test file
  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lol
          POSTGRES_PASSWORD: lol
          POSTGRES_DB: lol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lol -d lol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lol:lol@localhost:5432/lol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: migrations against the real database
        run: bun run db:migrate

      - name: integration tests
        run: bun run test:db

  # the shipped artifact: image builds, starts, migrates and serves
  package:
    name: package
    runs-on: ubuntu-latest
    needs: [quality, integration]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lol
          POSTGRES_PASSWORD: lol
          POSTGRES_DB: lol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lol -d lol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: validate compose file
        run: POSTGRES_PASSWORD=ci docker compose config -q

      # a schema change may never run without a dump it can be restored from
      - name: a deploy dumps before it migrates
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD=ci docker compose config --format json \
            > compose.json
          jq -e '.services.app.depends_on["pre-migrate"].condition
            == "service_completed_successfully"' compose.json
          jq -e '.services["pre-migrate"].volumes
            | any(.target == "/backups")' compose.json
          jq -e '.services["pre-migrate"].environment.BACKUP_DIR
            == "/backups/pre-migrate"' compose.json
          jq -e '.services["pre-migrate"].entrypoint
            | index("once")' compose.json
          rm compose.json

      - name: setup buildx
        uses: >-
          docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          load: true
          tags: lol-team:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name lol-team --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e DATABASE_URL=postgres://lol:lol@127.0.0.1:5432/lol \
            -e BETTER_AUTH_URL=http://localhost:3001 \
            -e WEB_ORIGIN=http://localhost:3001 \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            lol-team:ci

          echo "waiting for /api/health (up to 120s)"
          ready=""
          for attempt in $(seq 1 60); do
            running=$(docker inspect -f '{{.State.Running}}' lol-team)
            if [ "$running" != "true" ]; then
              echo "container exited before becoming healthy" >&2
              docker logs lol-team >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
              ready=1
              echo "healthy after $((attempt * 2 - 2))s"
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "no healthy response within 120s" >&2
            docker logs lol-team >&2
            exit 1
          fi

          # migrate logs a `db.migrate` event now, not "migrations applied".
          # capture first: pipe + grep -q can SIGPIPE under pipefail
          docker logs lol-team > /tmp/app.log
          grep -q 'db.migrate' /tmp/app.log

          session_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3001/api/auth/get-session)
          test "$session_code" = "200"

          # roster is tenant-scoped, but the guard answers 401 before it
          # looks the slug up: a fresh db still proves the route is mounted
          players_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3001/api/teams/ci/players)
          test "$players_code" = "401"

          curl -fsS http://127.0.0.1:3001/roster | grep -q 'id="root"'

      - name: backup and restore round trip
        run: sh scripts/ci-backup-roundtrip.sh

      - name: container logs on failure
        if: failure()
        run: docker logs lol-team || true

      - name: cleanup
        if: always()
        run: docker rm -f lol-team || true
